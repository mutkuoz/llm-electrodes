name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Persona files are valid
        run: python personas.py
      - name: Python files compile
        run: python -m py_compile steer.py server.py sweep.py personas.py check_parity.py
